<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 720" width="430" height="720">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5ee"/>
      <stop offset="60%" stop-color="#ffeee4"/>
      <stop offset="100%" stop-color="#ffe0d0"/>
    </linearGradient>
    <radialGradient id="haloPink" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ff8a9c" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ff8a9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloPurple" cx="80%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#a8b0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a8b0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sadAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#cdd6ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#cdd6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 (dark wrapper) -->
  <rect width="430" height="720" fill="#0a0820" rx="40"/>

  <!-- 卡片本体 (位于中间，类似分享出来的样子) -->
  <g transform="translate(35, 30)">
    <rect width="360" height="660" rx="20" fill="url(#cardBg)"/>
    <rect width="360" height="660" rx="20" fill="url(#haloPink)"/>
    <rect width="360" height="660" rx="20" fill="url(#haloPurple)"/>

    <!-- 双线虚框 -->
    <rect x="14" y="14" width="332" height="632" rx="14" fill="none" stroke="#1f1d1a" stroke-opacity="0.32" stroke-width="2"/>
    <rect x="22" y="22" width="316" height="616" rx="10" fill="none" stroke="#1f1d1a" stroke-opacity="0.16"/>

    <!-- 装饰星 -->
    <path d="M40 56 L42 60 L46 62 L42 64 L40 68 L38 64 L34 62 L38 60 Z" fill="#ff8a9c" opacity="0.5"/>
    <path d="M320 56 L322 60 L326 62 L322 64 L320 68 L318 64 L314 62 L318 60 Z" fill="#ff8a9c" opacity="0.5"/>
    <path d="M40 580 L42 584 L46 586 L42 588 L40 592 L38 588 L34 586 L38 584 Z" fill="#ff8a9c" opacity="0.5"/>
    <path d="M320 580 L322 584 L326 586 L322 588 L320 592 L318 588 L314 586 L318 584 Z" fill="#ff8a9c" opacity="0.5"/>

    <!-- Header -->
    <text x="180" y="60" font-family="'Songti SC','Noto Serif SC',Georgia,serif" font-style="italic" font-weight="600" font-size="20" fill="#1f1d1a" text-anchor="middle" letter-spacing="2">✦   寻 物 启 事   ✦</text>
    <text x="180" y="84" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="500" fill="#a89e8a" text-anchor="middle" letter-spacing="2">2026 · 05 · 03</text>

    <!-- 顶分隔虚线 -->
    <line x1="60" y1="100" x2="300" y2="100" stroke="#b8a896" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- 宝丽来 + 丢丢 -->
    <g transform="translate(180, 235) rotate(-2.6)">
      <!-- 阴影 -->
      <rect x="-95" y="-90" width="190" height="200" rx="3" fill="#000" opacity="0.18" transform="translate(4, 8)"/>
      <!-- 白纸框 -->
      <rect x="-95" y="-90" width="190" height="200" rx="3" fill="#fff"/>
      <!-- 照片区 (用渐变模拟) -->
      <defs>
        <linearGradient id="photoArea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a8c8e8"/>
          <stop offset="100%" stop-color="#5e8ec8"/>
        </linearGradient>
      </defs>
      <rect x="-83" y="-78" width="166" height="135" fill="url(#photoArea)"/>
      <!-- 简化"照片"内容：山 -->
      <path d="M-83 30 L-50 -20 L-20 10 L20 -30 L60 0 L83 -10 L83 57 L-83 57 Z" fill="#3d6e9e" opacity="0.85"/>
      <!-- 太阳 -->
      <circle cx="40" cy="-50" r="14" fill="#fff5e0" opacity="0.85"/>
      <!-- 胶带 -->
      <rect x="-30" y="-96" width="60" height="14" fill="#f5c88a" opacity="0.85"/>
      <!-- "丢失之前" caption -->
      <text x="0" y="92" font-family="'Songti SC','PingFang SC',serif" font-style="italic" font-size="13" fill="#5a4f44" text-anchor="middle">· 丢失之前 ·</text>
    </g>

    <!-- 丢丢 (sad mascot 探出右下) -->
    <g transform="translate(245, 230)">
      <!-- 蓝白光晕 -->
      <ellipse cx="50" cy="55" rx="60" ry="55" fill="url(#sadAura)"/>
      <!-- 耳朵 (sad triangle) -->
      <path d="M16 24 Q12 16 32 18 Q38 24 32 38 Q24 40 18 32 Z" fill="#cdd6ff" opacity="0.85" stroke="#cdd6ff" stroke-width="1.5"/>
      <path d="M84 24 Q88 16 68 18 Q62 24 68 38 Q76 40 82 32 Z" fill="#cdd6ff" opacity="0.85" stroke="#cdd6ff" stroke-width="1.5"/>
      <!-- Body -->
      <path d="M-4 60 Q-4 30 50 30 Q104 30 104 60 Q104 92 102 100 Q98 106 92 100 Q82 106 70 100 Q60 106 50 100 Q40 106 30 100 Q20 106 10 100 Q4 106 0 100 Q-4 92 -4 60 Z" fill="#cdd6ff" opacity="0.65" stroke="#cdd6ff" stroke-width="1.2"/>
      <!-- Eyes (sad) -->
      <ellipse cx="34" cy="54" rx="9" ry="10" fill="#1a1830"/>
      <ellipse cx="66" cy="54" rx="9" ry="10" fill="#1a1830"/>
      <ellipse cx="36" cy="50" rx="3.2" ry="4" fill="#fff"/>
      <ellipse cx="68" cy="50" rx="3.2" ry="4" fill="#fff"/>
      <!-- Tear -->
      <path d="M30 66 Q28 76 32 78 Q36 76 34 66 Z" fill="#a8b0ff" opacity="0.85"/>
      <!-- Sad eyebrows -->
      <path d="M22 38 Q34 34 46 40" stroke="#1a1830" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M54 40 Q66 34 78 38" stroke="#1a1830" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <!-- Blush -->
      <ellipse cx="14" cy="62" rx="5" ry="3" fill="#ff9aaa" opacity="0.55"/>
      <ellipse cx="86" cy="62" rx="5" ry="3" fill="#ff9aaa" opacity="0.55"/>
    </g>

    <!-- 说话框 -->
    <g transform="translate(245, 218)">
      <rect x="0" y="0" width="80" height="28" rx="14" fill="#fff" stroke="#1f1d1a" stroke-opacity="0.18"/>
      <path d="M22 28 L18 36 L30 28 Z" fill="#fff" stroke="#1f1d1a" stroke-opacity="0.18"/>
      <text x="40" y="19" font-family="'LXGW WenKai Screen','Songti SC',serif" font-style="italic" font-size="13" fill="#1f1d1a" text-anchor="middle">看，是这个</text>
    </g>

    <!-- "我丢了" -->
    <text x="180" y="412" font-family="'Songti SC','PingFang SC',serif" font-size="14" fill="#b8a896" text-anchor="middle">我丢了</text>

    <!-- 物品名 -->
    <text x="180" y="450" font-family="'Songti SC','Noto Serif SC',Georgia,serif" font-style="italic" font-weight="700" font-size="36" fill="#1f1d1a" text-anchor="middle">「妈妈送的娃娃」</text>

    <!-- 求助语 -->
    <text x="180" y="488" font-family="'Songti SC','PingFang SC',serif" font-style="italic" font-size="16" fill="#5a4f44" text-anchor="middle">如果有好心人看到，</text>
    <text x="180" y="510" font-family="'Songti SC','PingFang SC',serif" font-style="italic" font-size="16" fill="#5a4f44" text-anchor="middle">能把它还回来吗？</text>
    <text x="180" y="534" font-family="'Songti SC','PingFang SC',serif" font-size="11" fill="#ff8a9c" text-anchor="middle">— 圆滚滚的丢丢说</text>

    <!-- 中部分隔虚线 -->
    <line x1="80" y1="552" x2="280" y2="552" stroke="#d8c8b6" stroke-dasharray="3 4"/>

    <!-- Fields -->
    <text x="40" y="572" font-family="'JetBrains Mono',monospace" font-weight="500" font-size="9" fill="#a89e8a" letter-spacing="2">地点 / WHERE</text>
    <text x="320" y="572" font-family="'Songti SC','PingFang SC',serif" font-size="13" fill="#1f1d1a" text-anchor="end">图书馆三层窗台</text>
    <text x="40" y="596" font-family="'JetBrains Mono',monospace" font-weight="500" font-size="9" fill="#a89e8a" letter-spacing="2">特征 / DESC</text>
    <text x="320" y="596" font-family="'Songti SC','PingFang SC',serif" font-size="13" fill="#1f1d1a" text-anchor="end">蓝色，里面夹着便签</text>

    <!-- Stamp 红印章 -->
    <g transform="translate(298, 612) rotate(-10)">
      <circle cx="0" cy="0" r="32" fill="#ff8a9c" fill-opacity="0.14"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#ee6a82" stroke-width="2" stroke-opacity="0.85"/>
      <text x="0" y="-2" font-family="'Songti SC',serif" font-weight="700" font-size="14" fill="#ee6a82" text-anchor="middle">我丢</text>
      <text x="0" y="12" font-family="'JetBrains Mono',monospace" font-weight="500" font-size="6" fill="#ee6a82" text-anchor="middle">CASE No. 260503</text>
    </g>

    <!-- 落款 -->
    <text x="40" y="624" font-family="'Songti SC','PingFang SC',serif" font-style="italic" font-size="13" fill="#5a4f44">— 由「我丢」生成</text>
  </g>
</svg>
