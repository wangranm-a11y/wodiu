<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 720" width="430" height="720">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c1838"/>
      <stop offset="100%" stop-color="#0a0820"/>
    </radialGradient>
  </defs>
  <rect width="430" height="720" fill="url(#bg2)" rx="40"/>

  <!-- 散落星点 -->
  <g opacity="0.7">
    <circle cx="70" cy="100" r="1.4" fill="#fff"/>
    <circle cx="380" cy="80" r="1.6" fill="#fff"/>
    <circle cx="200" cy="180" r="1" fill="#fff" opacity="0.6"/>
    <circle cx="60" cy="500" r="1" fill="#fff" opacity="0.6"/>
  </g>

  <!-- Top bar -->
  <g transform="translate(24, 24)">
    <circle cx="6" cy="14" r="5" fill="#ff8a9c"/>
    <text x="20" y="20" font-family="-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#f4f0e8" letter-spacing="2">我丢</text>
    <text x="320" y="19" font-family="'JetBrains Mono',monospace" font-size="11" fill="#f4f0e8" letter-spacing="1">15:24:08</text>
    <line x1="0" y1="34" x2="382" y2="34" stroke="#fff" stroke-opacity="0.06"/>
  </g>

  <!-- Title -->
  <g transform="translate(28, 100)">
    <text x="0" y="38" font-family="-apple-system,'PingFang SC',sans-serif" font-size="32" font-weight="700" fill="#f4f0e8" letter-spacing="0.02em">这东西</text>
    <text x="0" y="78" font-family="-apple-system,'PingFang SC',sans-serif" font-size="32" font-weight="700" fill="#f4f0e8" letter-spacing="0.02em">对你来说……</text>
    <text x="0" y="112" font-family="'LXGW WenKai Screen','Songti SC',serif" font-size="13" fill="#a8a098">没有标准答案，凭感觉就好。</text>
  </g>

  <!-- Three weight cards -->
  <g transform="translate(28, 248)">
    <rect x="0" y="0" width="374" height="74" rx="14" fill="#fff" fill-opacity="0.045" stroke="#fff" stroke-opacity="0.10"/>
    <text x="34" y="48" font-size="28" text-anchor="middle">💚</text>
    <text x="68" y="36" font-family="-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#f4f0e8">没事，随口一提</text>
    <text x="68" y="58" font-family="'LXGW WenKai Screen','Songti SC',serif" font-size="12" fill="#a8a098">就是想记一笔，不至于影响今天</text>
    <text x="350" y="44" font-family="serif" font-size="22" fill="#a8a098" text-anchor="middle">›</text>
  </g>

  <g transform="translate(28, 332)">
    <!-- Selected with orange border + glow -->
    <rect x="0" y="0" width="374" height="74" rx="14" fill="#fff" fill-opacity="0.075" stroke="#ffc58a" stroke-width="1.5"/>
    <ellipse cx="187" cy="37" rx="190" ry="34" fill="#ffc58a" fill-opacity="0.10"/>
    <text x="34" y="50" font-size="32" text-anchor="middle" transform="rotate(-6 34 50)">🧡</text>
    <text x="68" y="36" font-family="-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#f4f0e8">哎呀……有点心疼</text>
    <text x="68" y="58" font-family="'LXGW WenKai Screen','Songti SC',serif" font-size="12" fill="#a8a098">心里咯噔一下，会想几次</text>
    <text x="350" y="44" font-family="serif" font-size="22" fill="#ff8a9c" text-anchor="middle">›</text>
  </g>

  <g transform="translate(28, 416)">
    <rect x="0" y="0" width="374" height="74" rx="14" fill="#fff" fill-opacity="0.045" stroke="#fff" stroke-opacity="0.10"/>
    <text x="34" y="48" font-size="28" text-anchor="middle">❤️</text>
    <text x="68" y="36" font-family="-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#f4f0e8">求求了，快回来</text>
    <text x="68" y="58" font-family="'LXGW WenKai Screen','Songti SC',serif" font-size="12" fill="#a8a098">这件不能轻飘飘地翻篇</text>
    <text x="350" y="44" font-family="serif" font-size="22" fill="#a8a098" text-anchor="middle">›</text>
  </g>

  <!-- Step actions -->
  <g transform="translate(28, 528)">
    <rect x="0" y="0" width="120" height="48" rx="24" fill="transparent" stroke="#fff" stroke-opacity="0.10"/>
    <text x="60" y="30" font-family="'Songti SC','PingFang SC',serif" font-style="italic" font-size="14" font-weight="600" fill="#a8a098" text-anchor="middle">← 改一下</text>
    <rect x="132" y="0" width="242" height="48" rx="24" fill="#ff8a9c"/>
    <text x="253" y="30" font-family="-apple-system,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#1a1830" text-anchor="middle" letter-spacing="2">下一步</text>
  </g>

  <!-- Tabs -->
  <g transform="translate(0, 658)">
    <rect x="0" y="0" width="430" height="62" fill="#0a0820" fill-opacity="0.85" stroke="#fff" stroke-opacity="0.06"/>
    <line x1="40" y1="0" x2="68" y2="0" stroke="#ff8a9c" stroke-width="2"/>
    <text x="54" y="26" font-family="-apple-system,sans-serif" font-size="18" fill="#ff8a9c" text-anchor="middle">✦</text>
    <text x="54" y="46" font-family="-apple-system,'PingFang SC',sans-serif" font-size="10" font-weight="500" fill="#f4f0e8" text-anchor="middle">丢了</text>
    <text x="161" y="26" font-family="-apple-system,sans-serif" font-size="18" fill="#a8a098" text-anchor="middle">◐</text>
    <text x="161" y="46" font-family="-apple-system,'PingFang SC',sans-serif" font-size="10" font-weight="500" fill="#a8a098" text-anchor="middle">还在</text>
    <text x="269" y="26" font-family="-apple-system,sans-serif" font-size="18" fill="#a8a098" text-anchor="middle">✧</text>
    <text x="269" y="46" font-family="-apple-system,'PingFang SC',sans-serif" font-size="10" font-weight="500" fill="#a8a098" text-anchor="middle">星图</text>
    <text x="376" y="26" font-family="-apple-system,sans-serif" font-size="18" fill="#a8a098" text-anchor="middle">◯</text>
    <text x="376" y="46" font-family="-apple-system,'PingFang SC',sans-serif" font-size="10" font-weight="500" fill="#a8a098" text-anchor="middle">自己</text>
  </g>
</svg>
